name: Build SdfGlue (pull request)

# Test build for every pull request commit: the build is uploaded as a workflow artifact
# and linked in a single PR comment (updated on each commit, with a history of previous builds).
# Never publishes GitHub releases - that is done only by build.yml.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  # required to create and update the PR comment with the download link
  pull-requests: write
  issues: write

# A new commit in the same PR cancels the build still running for the previous one
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # To avoid warning:
  # Node.js 20 actions are deprecated. The following actions are running on Node.js 20
  # and may not work as expected
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Build the PR head commit (the one shown in the PR), not the temporary merge commit
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Compose version
      id: version
      shell: pwsh
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        [xml]$xml = Get-Content "src\Directory.Build.props"
        $baseVersion = $xml.Project.PropertyGroup.Version
        $shortSha = $env:HEAD_SHA.Substring(0, 7)

        # numeric version (assembly/file version) and the display version shown in the window title
        $version     = "$baseVersion.${{ github.run_number }}"
        $infoVersion = "$version-pr$($env:PR_NUMBER)+$shortSha"

        echo "version=$version"                                       >> $env:GITHUB_OUTPUT
        echo "info=$infoVersion"                                      >> $env:GITHUB_OUTPUT
        echo "short_sha=$shortSha"                                    >> $env:GITHUB_OUTPUT
        echo "artifact=SdfGlue-$version-pr$($env:PR_NUMBER)-$shortSha" >> $env:GITHUB_OUTPUT

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Cache NuGet
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore src/SdfGlue.sln

    - name: Publish
      shell: pwsh
      run: |
        dotnet publish src/SdfGlueEditor/SdfGlueEditor.csproj `
          -c Release `
          -r win-x64 `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -p:Version=${{ steps.version.outputs.version }} `
          -p:FileVersion=${{ steps.version.outputs.version }} `
          "-p:InformationalVersion=${{ steps.version.outputs.info }}" `
          -o bin

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.artifact }}
        path: bin
        retention-days: 14

    # Pull requests from forks get a read-only token - the build still works, only the comment is skipped
    - name: Comment on pull request
      if: github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v7
      env:
        VERSION: ${{ steps.version.outputs.info }}
        SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ARTIFACT_NAME: ${{ steps.version.outputs.artifact }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      with:
        script: |
          const marker = '<!-- sdfglue-pr-build -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const e = process.env;

          const commitUrl = `${context.serverUrl}/${owner}/${repo}/pull/${issue_number}/commits/${e.HEAD_SHA}`;
          const date = new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC';
          const row = `| \`${e.VERSION}\` | [\`${e.SHORT_SHA}\`](${commitUrl}) | [download](${e.ARTIFACT_URL}) | [run](${e.RUN_URL}) | ${date} |`;

          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));

          // keep previous builds as history rows (newest first)
          let rows = existing ? existing.body.split('\n').filter(l => l.startsWith('| `')) : [];
          rows.unshift(row);
          rows = rows.slice(0, 30);

          const body = [
            marker,
            '### SdfGlue test build',
            '',
            `**Latest build:** [${e.ARTIFACT_NAME}](${e.ARTIFACT_URL}) (version \`${e.VERSION}\`, commit \`${e.SHORT_SHA}\`)`,
            '',
            'Unzip and run `SdfGlue.exe` (requires the .NET 10 Desktop Runtime). The version is shown in the window title.',
            'Downloading requires signing in to GitHub. Artifacts expire after 14 days.',
            '',
            '| Version | Commit | Artifact | Run | Built |',
            '|---|---|---|---|---|',
            ...rows,
          ].join('\n');

          if (existing)
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          else
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
