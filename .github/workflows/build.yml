name: Build SdfGlue (latest/release)

on:
  push:
    branches: [ "main" ]
    tags:
      - "release-*"

permissions:
  # required to create and update GitHub releases (latest build)
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Extract base version
      id: version
      shell: pwsh
      run: |
        [xml]$xml = Get-Content "src\Directory.Build.props"
        $baseVersion = $xml.Project.PropertyGroup.Version

        echo "base=$baseVersion" >> $env:GITHUB_OUTPUT
    
    - name: Compose full version
      id: fullversion
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.base }}.${{ github.run_number }}"
        echo "version=$version" >> $env:GITHUB_OUTPUT


    # Install the .NET Core workload
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Clean output
      run: |
        if (Test-Path bin) {
          Remove-Item bin\*.dll -ErrorAction SilentlyContinue
          Remove-Item bin\*.exe -ErrorAction SilentlyContinue
          Remove-Item bin\SdfGlue.deps.json -ErrorAction SilentlyContinue
          Remove-Item bin\SdfGlue.runtimeconfig.json -ErrorAction SilentlyContinue
        }
      shell: pwsh

    # Cache NuGet
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore src/SdfGlue.sln

    # Unit tests (the animation module); a failing test stops the build before anything is published
    - name: Test
      run: dotnet test src/SingleDocAppAnimation.Tests/SingleDocAppAnimation.Tests.csproj -c Release --no-restore

    - name: Publish
      shell: pwsh
      run: |
        dotnet publish src/SdfGlueEditor/SdfGlueEditor.csproj `
          -c Release `
          -r win-x64 `
          -p:DebugType=none `
          -p:DebugSymbols=false `
          -p:Version=${{ steps.fullversion.outputs.version }} `
          -p:FileVersion=${{ steps.fullversion.outputs.version }} `
          -o bin

    # The application does not start without the workspace (bin/Workspace) - check the folders and files it requires
    # (lists RequiredDirectories / RequiredFiles in src/SdfGlueCore/SdfGlueWorkspace.cs)
    - name: Check workspace
      shell: pwsh
      run: |
        $code = Get-Content -Raw src/SdfGlueCore/SdfGlueWorkspace.cs
        $missing = @()
        foreach ($list in "RequiredDirectories", "RequiredFiles") {
          $block = [regex]::Match($code, "$list\s*=\s*\{(.*?)\};", "Singleline").Groups[1].Value
          $items = [regex]::Matches($block, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          if ($items.Count -eq 0) { throw "Cannot read $list from SdfGlueWorkspace.cs" }
          $missing += $items | Where-Object { -not (Test-Path (Join-Path bin/Workspace $_)) }
        }
        if (-not (Test-Path bin/Layouts/Default.xml)) { $missing += "bin/Layouts/Default.xml" }
        if ($missing) { throw "Missing in bin/Workspace: $($missing -join ', ')" }

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: SdfGlue-${{ steps.fullversion.outputs.version }}
        path: bin

    - name: Create ZIP (for "latest" release)
      shell: pwsh
      run: |
        Compress-Archive -Path bin\* -DestinationPath SdfGlue-latest.zip

    - name: Create ZIP (for tagged release)
      shell: pwsh
      run: |
        Compress-Archive -Path bin\* -DestinationPath SdfGlue-${{ steps.fullversion.outputs.version }}.zip

    # latest (dev build)
    - name: Upload to "latest" release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: latest
        name: Latest development build
        body: |
          Development build
          Version: ${{ steps.fullversion.outputs.version }}
          Commit: ${{ github.sha }}
        files: SdfGlue-latest.zip
        prerelease: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # release notes: commits since the previous release-* tag
    - name: Generate release notes
      if: startsWith(github.ref, 'refs/tags/release-')
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $prev = git describe --tags --abbrev=0 --match "release-*" "$tag^" 2>$null
        if ($prev) { $range = "$prev..$tag" } else { $range = $tag }
        $changes = git log $range --no-merges --pretty=format:"- %s (%h)"

        $body = @(
          "**Version**: ${{ steps.fullversion.outputs.version }}"
          "**Commit**: ${{ github.sha }}"
        )
        if ($prev) {
          $body += "**Full diff**: https://github.com/${{ github.repository }}/compare/$prev...$tag"
        } else {
          $body += "**Full history**: https://github.com/${{ github.repository }}/commits/$tag"
        }
        $body += ""
        $body += "**Changes**:"
        $body += $changes
        $body | Out-File -Encoding utf8 release-notes.md

    # tagged release
    - name: Create tagged release
      # check for tag
      if: startsWith(github.ref, 'refs/tags/release-')
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: SdfGlue ${{ steps.fullversion.outputs.version }}
        body_path: release-notes.md
        files: SdfGlue-${{ steps.fullversion.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

