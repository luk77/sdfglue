name: Build SdfGlue (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  # required to create and update GitHub releases (latest build)
  contents: write

env:
  # To avoid warning: 
  # Node.js 20 actions are deprecated. The following actions are running on Node.js 20 
  # and may not work as expected
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:

  build:

    #strategy:
    #  matrix:
    #    configuration: [Debug, Release]

    # For a list of available runner types, refer to
    # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: windows-latest

    #env:
      #Solution_Name: SdfGlue.sln                                # Replace with your solution name, i.e. MyWpfApp.sln.
      #Test_Project_Path: your-test-project-path                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      #Wap_Project_Directory: your-wap-project-directory-name    # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      #Wap_Project_Path: your-wap-project-path                   # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract base version
      id: version
      shell: pwsh
      run: |
        [xml]$xml = Get-Content "src\Directory.Build.props"
        $baseVersion = $xml.Project.PropertyGroup.Version

        echo "base=$baseVersion" >> $env:GITHUB_OUTPUT
    
    - name: Compose full version
      id: fullversion
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.base }}.${{ github.run_number }}"
        echo "version=$version" >> $env:GITHUB_OUTPUT



    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    #- name: Setup MSBuild.exe
    #  uses: microsoft/setup-msbuild@v2

    - name: Clean output
      run: |
        if (Test-Path bin) {
          Remove-Item bin\*.dll -ErrorAction SilentlyContinue
          Remove-Item bin\*.exe -ErrorAction SilentlyContinue
          Remove-Item bin\SdfGlue.deps.json -ErrorAction SilentlyContinue
          Remove-Item bin\SdfGlue.runtimeconfig.json -ErrorAction SilentlyContinue
        }
      shell: pwsh

    # CACHE NUGET
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore src/SdfGlue.sln
  
    - name: Publish
      run: dotnet publish src/SdfGlueEditor/SdfGlueEditor.csproj `
        -c Release `
        -r win-x64 `
        -p:DebugType=none `
        -p:DebugSymbols=false `
        -p:Version=${{ steps.fullversion.outputs.version }} `
        -p:FileVersion=${{ steps.fullversion.outputs.version }}
        -o bin

    #- name: Create ZIP
    #  shell: pwsh
    #  run: |
    #    Compress-Archive -Path bin\* -DestinationPath SdfGlue-${{ steps.fullversion.outputs.version }}.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SdfGlue-${{ steps.fullversion.outputs.version }}
        path: bin


    - name: Create ZIP (for "latest" release)
      shell: pwsh
      run: |
        Compress-Archive -Path bin\* -DestinationPath SdfGlue-latest.zip

    - name: Upload to "latest" release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest build
        body: |
          Development build
          Version: ${{ steps.fullversion.outputs.version }}
          Commit: ${{ github.sha }}
        files: SdfGlue-latest.zip
        prerelease: true
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    
    # Execute all unit tests in the solution
    #- name: Execute unit tests
    #  run: dotnet test

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    #- name: Restore the application
    #  run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
    #  env:
    #    Configuration: ${{ matrix.configuration }}

    # Decode the base 64 encoded pfx and save the Signing_Certificate
